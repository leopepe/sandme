name: Release

# Tag a commit `vX.Y.Z` and push the tag to build binaries for every target and
# publish them on a GitHub Release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  # A dispatch run rehearses the whole pipeline from a branch without cutting a tag, so a
  # packaging or upload break is found before the tag exists rather than after.
  workflow_dispatch:

# The release job creates a GitHub Release, which needs write access to contents.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # A stuck or unschedulable runner fails fast instead of hanging for hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS is Apple Silicon only (macos-14); Intel x86_64 macOS is dropped
        # (Apple EOL platform, GitHub's Intel runner pool deprecated). No
        # x86_64-apple-darwin release binary is produced.
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with Cargo.toml ships a binary whose `--version` contradicts the
      # release it was downloaded from, and the tag cannot be moved once people have it. Fail
      # here instead. On workflow_dispatch `github.ref_name` is a branch, so there is no tag
      # to check and the step is skipped.
      - name: Check the tag matches the version in Cargo.toml
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          # Read straight from the manifest rather than via `cargo metadata`: this step runs
          # before the toolchain is installed, and the `[package]` section is unambiguous.
          manifest=$(awk -F'[ \t]*=[ \t]*' '
            /^\[/ { section = $0 }
            section == "[package]" && $1 == "version" { gsub(/"/, "", $2); print $2; exit }
          ' Cargo.toml)
          if [ "${tag#v}" != "$manifest" ]; then
            echo "tag ${tag} does not match Cargo.toml version ${manifest}" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Package the binary
        shell: bash
        run: |
          set -euo pipefail
          bin=sandme
          dist="${bin}-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/${bin}" "$dist/"
          # `[ -f x ] && cp ...` is a false step exit under `set -e` the day the file is not
          # there: the test returns 1 and takes the whole step with it. An `if` says the same
          # thing and keeps a missing optional file optional. The licence travels with the
          # binary because a distributed build without its terms is not distributable.
          for extra in README.md LICENSE; do
            if [ -f "$extra" ]; then
              cp "$extra" "$dist/"
            fi
          done
          tar czf "${dist}.tar.gz" "$dist"
          shasum -a 256 "${dist}.tar.gz" > "${dist}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    # A dispatch run exists to rehearse the build and the packaging, and `github.ref_name` is
    # a branch there — publishing would open a draft release named after that branch. Skip it
    # and let the rehearsal end with the artifacts.
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Created as a draft: the generated notes and the attached archives get a human
          # read before anything is public, and a draft can be deleted where a published
          # release with downloads cannot be taken back.
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --draft \
            dist/*.tar.gz dist/*.tar.gz.sha256
