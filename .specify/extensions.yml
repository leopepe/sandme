installed:
- architecture-guard
- fix-findings
- gates
- handover
- red-team
- review
- ripple
- security-review
settings:
  auto_execute_hooks: true
hooks:
  after_implement:
  - extension: gates
    command: speckit.gates.verify
    enabled: true
    optional: true
    priority: 10
    prompt: Run quality gates on the implemented changes?
    description: Run the gate suite after implementation
    condition: null
  - extension: review
    command: speckit.review.run
    enabled: true
    optional: true
    priority: 10
    prompt: Run PR review on implemented changes?
    description: Comprehensive review after implementation
    condition: null
  - extension: architecture-guard
    command: speckit.architecture-guard.ag-review-implementation
    enabled: true
    optional: true
    priority: 10
    prompt: Would you like to run a post-implementation architecture review?
    description: ''
    condition: null
  - extension: ripple
    command: speckit.ripple.scan
    enabled: true
    optional: true
    priority: 10
    prompt: Scan for untested side effects?
    description: Auto-scan for ripple effects after implementation
    condition: null
  - extension: fix-findings
    command: speckit.fix-findings.run
    enabled: true
    optional: true
    priority: 10
    prompt: Run fix-findings to analyze and resolve spec findings automatically?
    description: Post-implementation automated finding resolution
    condition: null
  - extension: security-review
    command: speckit.security-review.branch
    enabled: true
    optional: true
    priority: 10
    prompt: Would you like to scan the new implementation for security vulnerabilities?
    description: ''
    condition: null
  before_constitution:
  - extension: gates
    command: speckit.gates.constitution
    enabled: true
    optional: true
    priority: 10
    prompt: Run the guided constitution session first (interview, corpus principles,
      enforcement annotations)?
    description: Offer the guided, enforcement-aware session before the core constitution
      command runs
    condition: null
  after_plan:
  - extension: architecture-guard
    command: speckit.architecture-guard.ag-violation-detection
    enabled: true
    optional: true
    priority: 10
    prompt: Would you like to scan the technical plan for architectural drift and
      Constitution violations?
    description: ''
    condition: null
  - extension: security-review
    command: speckit.security-review.plan
    enabled: true
    optional: true
    priority: 10
    prompt: Would you like to perform a security review on the proposed technical
      plan?
    description: ''
    condition: null
  after_tasks:
  - extension: architecture-guard
    command: speckit.architecture-guard.ag-refactor-generator
    enabled: true
    optional: true
    priority: 10
    prompt: Would you like to generate architectural refactor tasks before implementation?
    description: ''
    condition: null
  - extension: security-review
    command: speckit.security-review.tasks
    enabled: true
    optional: true
    priority: 10
    prompt: Would you like to verify that security boundaries are represented in the
      tasks?
    description: ''
    condition: null
