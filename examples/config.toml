# sandme configuration — copy to ~/.sandme/config.toml and edit.
#
# Every key here has a matching environment variable, and the environment always
# wins over this file. No key is required; anything you omit takes its default.

# ---------------------------------------------------------------------------
# shared_paths  (env: SANDME_SHARED_PATHS, comma-separated)
#
# Paths the sandboxed command may READ AND WRITE. Everything not listed is
# denied for both. "~/" expands to your home directory, and symlinks are
# resolved to their targets before the profile is built.
#
# Default: the current working directory — the directory you run sandme in, and
# nothing else. To share more, list it here; "~/" shares your entire home
# directory, which is convenient and also the least confining setting there is —
# it includes ~/.ssh, ~/.aws and every dotfile credential you own.
#
# A path here is writable by the sandboxed process. For a toolchain you want
# readable-but-not-writable (so its binaries run but the process cannot modify
# it), use read_only_paths below instead.
# ---------------------------------------------------------------------------
shared_paths = [
  "~/Workspace",      # your projects — narrow this to a single repo if you can
]

# ---------------------------------------------------------------------------
# read_only_paths  (env: SANDME_READ_ONLY_PATHS, comma-separated)
#
# Paths the sandboxed command may READ AND EXECUTE, but NOT write. Use it for a
# toolchain prefix whose binaries must run while the process cannot modify it.
# "~/" expands and symlinks are resolved, exactly as for shared_paths, and the
# same guard applies: a "/" or "/proc"/"/sys" entry is refused.
#
# Default: empty — no toolchain directory is granted unless you name it here.
# ---------------------------------------------------------------------------
read_only_paths = [
  "/opt/homebrew",    # Homebrew on Apple silicon; brew binaries cannot load
                      # their dylibs without it. Intel Macs use /usr/local,
                      # which is already readable. Add "/nix" if you use Nix.
]

# ---------------------------------------------------------------------------
# proxy  (env: SANDME_PROXY=0 to disable)
#
# Whether to start the egress proxy and route the command through it. On by
# default. Set to false to run with NO network egress at all: no proxy is
# started, no HTTP(S)_PROXY is set, and no git-over-SSH tunnel is wired — so
# both HTTP(S) and git-over-SSH remotes fail. That is the point; an SSH git
# failure under proxy = false is expected, not a bug.
#
# Default: true
# ---------------------------------------------------------------------------
proxy = true

# ---------------------------------------------------------------------------
# proxy_port  (env: SANDME_PROXY_PORT)
#
# Loopback port the egress proxy listens on. It is the only network destination
# the sandbox allows, and HTTP_PROXY/HTTPS_PROXY in the command's environment
# point at it.
#
# 0 (the default) takes a free ephemeral port from the OS, so several sandme
# invocations run in parallel without colliding on a fixed port. Set a non-zero
# value only to pin a fixed, predictable port for one run.
#
# Default: 0
# ---------------------------------------------------------------------------
proxy_port = 0

# ---------------------------------------------------------------------------
# gui_mode  (env: SANDME_GUI_MODE=1)
#
# Also grants read+write to ~/Library and to your per-user temp directory
# ($TMPDIR). It does NOT open the world-shared /private/tmp or all of
# /private/var/folders — only the temp directory macOS gives your own session.
#
# GUI applications and most editors keep state, caches and preferences under
# ~/Library and need scratch space in the temp directory. Without it Neovim
# starts but reports "tempdir create failed: operation not permitted" and loses
# swap files, undo history and :terminal; Zed will not launch at all.
#
# ~/Library/LaunchAgents, ~/Library/LaunchDaemons and ~/Library/Keychains stay
# denied even here, and even when shared_paths lists your whole home directory.
# A plist in either launchd directory runs outside the sandbox at your next
# login.
#
# The temp grant is not scoped to the launched app — it covers those directories
# for every application: https://github.com/leopepe/sandme/issues/12
#
# Default: false
# ---------------------------------------------------------------------------
gui_mode = true

# ---------------------------------------------------------------------------
# allow_private_egress  (env: SANDME_ALLOW_PRIVATE_EGRESS=1)
#
# Lets the proxy relay to your own machine and network: loopback (127.0.0.0/8,
# ::1), RFC1918 (10/8, 172.16/12, 192.168/16), link-local (169.254/16 — which
# includes the cloud metadata address 169.254.169.254 — and fe80::/10),
# unique-local (fc00::/7) and the unspecified addresses.
#
# Off by default. Those are exactly the destinations the sandbox denies the
# command directly, and the proxy runs outside the sandbox: relaying to them
# turns it into a way around the profile's network rule, reachable by anything
# running inside: https://github.com/leopepe/sandme/issues/15
#
# Turn it on when the command has to reach something local — a model server on
# 127.0.0.1:11434, a dev API — and accept that it re-opens all of the above at
# once. It does not change who may use the proxy: every request still needs the
# credential sandme puts in the command's HTTP_PROXY.
#
# Default: false
# ---------------------------------------------------------------------------
allow_private_egress = false
