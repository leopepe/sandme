[package]
name = "sandme"
version = "0.1.0"
edition = "2024"
description = "Run a command inside an OS sandbox (macOS Seatbelt or Linux Landlock) with its network egress through a managed proxy"
license = "MIT"
repository = "https://github.com/leopepe/sandme"
readme = "README.md"
keywords = ["sandbox", "seatbelt", "landlock", "security", "cli"]
categories = ["command-line-utilities", "os"]
# Edition 2024 alone would allow 1.85, but src/ uses let-chains
# (`if let ... && let ...`), stabilised in 1.88.
rust-version = "1.88"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Size limits from docs/guidelines/code/simplicity.md §2. These two are nursery lints, so the
# group settings above do not reach them. Thresholds live in clippy.toml.
cognitive_complexity = "warn"
excessive_nesting = "warn"

[dependencies]
clap = { version = "4", features = ["derive"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"

# The Landlock backend is Linux-only, so its dependencies are target-scoped:
# nothing here compiles on macOS. `landlock` builds and applies the ruleset;
# `libc` supplies the `EPERM`/`pre_exec` glue and the ABI-probe syscall.
[target.'cfg(target_os = "linux")'.dependencies]
# Only the core Ruleset/PathFd/NetPort/BitFlags API is used, so no default
# features are needed (D9 — minimal features). `libc` keeps std (needs it).
landlock = { version = "0.4", default-features = false }
libc = "0.2"

[dev-dependencies]
serial_test = "3"
